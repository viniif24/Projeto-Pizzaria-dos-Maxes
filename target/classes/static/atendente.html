<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Atendente</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;

            /* 🔥 FUNDO VERMELHO IGUAL AO DA SUA TELA */
            background: linear-gradient(135deg, #8b0000, #cc0000, #990000);
            height: 100vh;
            background-attachment: fixed;
            background-repeat: no-repeat;

            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            margin-top: 40px;
            width: 90%;
            max-width: 1200px;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.3);
        }

        h2 {
            color: #8b0000;
            text-align: left;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        table th, table td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        table th {
            background: #eee;
        }

        .btn {
            background-color: #d00000;
            color: white;
            padding: 10px 18px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #a30000;
        }

        a {
            text-decoration: none;
            color: #333;
            font-weight: bold;
            display: inline-block;
            margin-top: 20px;
        }
    </style>

</head>
<body>

    <div class="container">
        <h2>Painel do Atendente</h2>

        <p>Bem-vindo, joao!</p>
        <p>Veja abaixo todos os pedidos realizados:</p>

        <button class="btn" onclick="carregarPedidos()">🔄 Atualizar Pedidos</button>

        <table>
            <tr>
                <th>ID</th>
                <th>Usuário</th>
                <th>Produto</th>
                <th>Preço</th>
                <th>Status</th>
            </tr>
            <tbody id="tabelaPedidos"></tbody>
        </table>

        <a href="index.html">🏠 Voltar ao Início</a>
    </div>

    <script>
        function carregarPedidos() {
            fetch("http://localhost:8080/pedidos")
                .then(response => response.json())
                .then(data => {
                    const tabela = document.getElementById("tabelaPedidos");
                    tabela.innerHTML = "";

                    data.forEach(pedido => {
                        tabela.innerHTML += `
                            <tr>
                                <td>${pedido.id}</td>
                                <td>${pedido.usuario}</td>
                                <td>${pedido.produto}</td>
                                <td>R$ ${pedido.preco}</td>
                                <td>${pedido.status}</td>
                            </tr>
                        `;
                    });
                });
        }
    </script>

</body>
</html>
